[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-progression-robotics"
version = "0.1.0"
description = "A small educational Python robotics progression project."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Amit10311" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["python_progression_robotics", "robotics"]
